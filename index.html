<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RareMC Drops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #050816;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .glow {
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
    }

    .neon {
      color: #c084fc;
      text-shadow: 0 0 12px rgba(192,132,252,0.8);
    }

    .bg-grid {
      background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .pulse-dot {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    .card-hover:hover {
      transform: translateY(-4px);
      transition: 0.25s ease;
      border-color: rgba(192,132,252,0.5);
    }
  </style>
</head>
<body class="text-white bg-grid min-h-screen">

  <div class="absolute top-[-200px] left-[-100px] w-[500px] h-[500px] bg-purple-600 rounded-full blur-3xl opacity-20"></div>
  <div class="absolute bottom-[-200px] right-[-100px] w-[500px] h-[500px] bg-blue-500 rounded-full blur-3xl opacity-20"></div>

  <header class="relative z-10 px-8 py-8 flex items-center justify-between border-b border-white/10">
    <div>
      <h1 class="text-4xl font-bold neon">RareMC Drops</h1>
      <p class="text-gray-400 mt-1">Live Minecraft Rare Name Drop Tracker</p>
    </div>

    <div class="glass rounded-2xl px-5 py-3 flex items-center gap-3 glow">
      <div class="w-3 h-3 rounded-full bg-green-400 pulse-dot"></div>
      <span class="text-sm text-gray-300">LIVE TRACKING</span>
    </div>
  </header>

  <section class="relative z-10 px-8 py-12">
    <div class="max-w-7xl mx-auto">

      <div class="grid lg:grid-cols-4 gap-5 mb-10">

        <div class="glass rounded-3xl p-6 glow card-hover">
          <p class="text-gray-400 text-sm">Tracked Names</p>
          <h2 id="trackedCount" class="text-4xl font-bold mt-2">0</h2>
        </div>

        <div class="glass rounded-3xl p-6 glow card-hover">
          <p class="text-gray-400 text-sm">Search Score 80+</p>
          <h2 id="highScoreCount" class="text-4xl font-bold mt-2">0</h2>
        </div>

        <div class="glass rounded-3xl p-6 glow card-hover">
          <p class="text-gray-400 text-sm">Dropping Today</p>
          <h2 id="todayCount" class="text-4xl font-bold mt-2">0</h2>
        </div>

        <div class="glass rounded-3xl p-6 glow card-hover">
          <p class="text-gray-400 text-sm">HOTTEST</p>
          <h2 id="topName" class="text-4xl font-bold mt-2 neon">---</h2>
        </div>

      </div>

      <div class="glass rounded-3xl p-6 mb-8">
        <div class="flex flex-col lg:flex-row gap-4 justify-between items-center">

          <input
            id="searchInput"
            type="text"
            placeholder="Search names..."
            class="w-full lg:w-[300px] bg-black/30 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-purple-500"
          />

          <div class="flex gap-3 flex-wrap">
            <button onclick="filterType('ALL')" class="filter-btn px-4 py-2 rounded-xl glass">ALL</button>
            <button onclick="filterType('3L')" class="filter-btn px-4 py-2 rounded-xl glass">3L</button>
            <button onclick="filterType('4L')" class="filter-btn px-4 py-2 rounded-xl glass">4L</button>
            <button onclick="filterType('WORD')" class="filter-btn px-4 py-2 rounded-xl glass">WORD</button>
            <button onclick="filterType('OG')" class="filter-btn px-4 py-2 rounded-xl glass">OG</button>
          </div>

        </div>
      </div>

      <div class="overflow-auto glass rounded-3xl glow">
        <table class="w-full min-w-[1000px]">
          <thead>
            <tr class="border-b border-white/10 text-gray-400 text-left">
              <th class="p-5">NAME</th>
              <th class="p-5">TYPE</th>
              <th class="p-5">SEARCH SCORE</th>
              <th class="p-5">STATUS</th>
              <th class="p-5">DROP TIME</th>
              <th class="p-5">COUNTDOWN</th>
              <th class="p-5">NameMC</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>

    </div>
  </section>

  <script>

    const names = [
      {
        name: 'ymc',
        type: '3L',
        searches: 222,
        drop: Date.now() + 1000 * 60 * 45,
        status: 'HOT'
      },
      {
        name: 'void',
        type: 'WORD',
        searches: 412,
        drop: Date.now() + 1000 * 60 * 60 * 6,
        status: 'TRACKED'
      },
      {
        name: 'w7d',
        type: '3L',
        searches: 183,
        drop: Date.now() + 1000 * 60 * 8,
        status: 'SOON'
      },
      {
        name: 'rune',
        type: 'OG',
        searches: 305,
        drop: Date.now() + 1000 * 60 * 60 * 20,
        status: 'OG'
      },
      {
        name: 'h4x',
        type: '3L',
        searches: 98,
        drop: Date.now() + 1000 * 60 * 60 * 2,
        status: 'LIVE'
      },
      {
        name: 'ghost',
        type: 'WORD',
        searches: 501,
        drop: Date.now() + 1000 * 60 * 60 * 30,
        status: 'INSANE'
      },
      {
        name: 'zxq9',
        type: '4L',
        searches: 84,
        drop: Date.now() + 1000 * 60 * 60 * 11,
        status: 'TRACKED'
      },
      {
        name: 'envy',
        type: 'OG',
        searches: 284,
        drop: Date.now() + 1000 * 60 * 3,
        status: 'HOT'
      }
    ];

    let currentFilter = 'ALL';

    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('searchInput');

    function countdown(ms) {
      const total = Math.floor(ms / 1000);

      const d = Math.floor(total / 86400);
      const h = Math.floor((total % 86400) / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;

      return `${d}d ${h}h ${m}m ${s}s`;
    }

    function render() {
      const keyword = searchInput.value.toLowerCase();

      let filtered = names.filter(item => {
        const matchesFilter = currentFilter === 'ALL' || item.type === currentFilter;
        const matchesSearch = item.name.toLowerCase().includes(keyword);

        return matchesFilter && matchesSearch;
      });

      filtered = filtered.sort((a,b)=> b.searches - a.searches);

      tableBody.innerHTML = '';

      filtered.forEach(item => {

        const row = document.createElement('tr');

        row.className = 'border-b border-white/5 hover:bg-white/5 transition';

        row.innerHTML = `
          <td class="p-5">
            <div class="font-bold text-xl neon">${item.name}</div>
          </td>

          <td class="p-5">
            <span class="glass px-3 py-2 rounded-xl text-sm">
              ${item.type}
            </span>
          </td>

          <td class="p-5">
            <span class="text-purple-300 font-bold">
              ${item.searches}
            </span>
          </td>

          <td class="p-5">
            <span class="px-3 py-2 rounded-xl bg-purple-500/20 text-purple-300 border border-purple-500/20 text-sm">
              ${item.status}
            </span>
          </td>

          <td class="p-5 text-gray-300">
            ${new Date(item.drop).toLocaleString()}
          </td>

          <td class="p-5 font-bold text-green-300">
            ${countdown(item.drop - Date.now())}
          </td>

          <td class="p-5">
            <a
              href="https://namemc.com/search?q=${item.name}"
              target="_blank"
              class="px-4 py-2 rounded-xl bg-white/10 hover:bg-purple-500/30 transition"
            >
              Open
            </a>
          </td>
        `;

        tableBody.appendChild(row);
      });

      updateStats(filtered);
    }

    function updateStats(list) {
      document.getElementById('trackedCount').innerText = names.length;

      document.getElementById('highScoreCount').innerText = names.filter(x => x.searches >= 80).length;

      document.getElementById('todayCount').innerText = names.filter(x => x.drop - Date.now() < 86400000).length;

      const top = [...names].sort((a,b)=> b.searches - a.searches)[0];
      document.getElementById('topName').innerText = top.name;
    }

    function filterType(type) {
      currentFilter = type;
      render();
    }

    searchInput.addEventListener('input', render);

    setInterval(render, 1000);

    render();

    // ===== FAKE LIVE UPDATES =====

    setInterval(() => {
      names.forEach(name => {
        const random = Math.floor(Math.random() * 5);
        name.searches += random;
      });
    }, 5000);

  </script>

</body>
</html>
