<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Oppai Penint</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #fff3f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ff5e7e;
            font-weight: bold;
            pointer-events: none;
            font-size: 16px;
            text-shadow: 1px 1px 0 #fff;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="info">画面をドラッグして線を引くと、あのシルエットがぷるんっと現れます</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let isDrawing = false;
        let currentStroke = [];
        let completedOppais = [];

        // ぷるぷるアニメーションの物理パラメータ
        const SPRING = 0.18;    // バネの強さ（揺れの速さ）
        const FRICTION = 0.80;  // 摩擦（おさまりの良さ）

        // マウス ＆ タッチイベント登録
        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);

        canvas.addEventListener('touchstart', e => { start(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener('touchmove', e => { move(e.touches[0]); e.preventDefault(); });
        window.addEventListener('touchend', end);

        function start(e) {
            isDrawing = true;
            currentStroke = [{ x: e.clientX, y: e.clientY }];
        }

        function move(e) {
            if (!isDrawing) return;
            currentStroke.push({ x: e.clientX, y: e.clientY });
        }

        function end() {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentStroke.length > 3) {
                const startPt = currentStroke[0];
                const endPt = currentStroke[currentStroke.length - 1];
                
                const dx = endPt.x - startPt.x;
                const dy = endPt.y - startPt.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // 一定以上の長さで引いたら生成
                if (distance > 30) {
                    const angle = Math.atan2(dy, dx);
                    
                    // 線の進行方向の「左側」に膨らむようベクトルを計算
                    const nx = Math.cos(angle - Math.PI / 2);
                    const ny = Math.sin(angle - Math.PI / 2);

                    completedOppais.push({
                        x1: startPt.x, y1: startPt.y,
                        x2: endPt.x, y2: endPt.y,
                        nx: nx, ny: ny,
                        angle: angle,
                        length: distance,
                        
                        // アニメーション用変数
                        scale: 0,          // 登場時はサイズ0から
                        targetScale: 1.0,  // 目標サイズ
                        velocity: 0,
                        life: 1.0          // 余韻を残して消えるライフ
                    });
                }
            }
            currentStroke = [];
        }

        // メインループ
        function loop() {
            // 背景クリア
            ctx.fillStyle = '#fff3f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 描いている最中の線
            if (isDrawing && currentStroke.length > 1) {
                ctx.beginPath();
                ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
                for (let i = 1; i < currentStroke.length; i++) {
                    ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
                }
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffb3c1';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // 2. 確定したおっぱいシルエットの計算と描画
            for (let i = completedOppais.length - 1; i >= 0; i--) {
                const op = completedOppais[i];

                // 物理演算（ぷるんぷるん揺れる動き）
                const acceleration = (op.targetScale - op.scale) * SPRING;
                op.velocity += acceleration;
                op.velocity *= FRICTION;
                op.scale += op.velocity;

                // 時間経過で消滅
                op.life -= 0.003;
                if (op.life <= 0) {
                    completedOppais.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = Math.min(1, op.life * 5);
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#333333'; // 画像のような綺麗な黒い線画に
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // 画像のシルエットを再現するための3つの重要制御点
                const currentLength = op.length * op.scale;
                const h = currentLength * 0.55; // おっぱいの高さ

                // 1. 上部のスロープ（なだらかな坂）
                const cp1x = op.x1 + (op.x2 - op.x1) * 0.3 + op.nx * (h * 0.4);
                const cp1y = op.y1 + (op.y2 - op.y1) * 0.3 + op.ny * (h * 0.4);

                // 2. 乳首の先端（ツンとした突起）の位置
                const nipX = op.x1 + (op.x2 - op.x1) * 0.55 + op.nx * h;
                const nipY = op.y1 + (op.y2 - op.y1) * 0.55 + op.ny * h;

                // 3. 下部のふくらみ（豊かな丸み）
                const cp2x = op.x1 + (op.x2 - op.x1) * 0.8 + op.nx * (h * 0.6);
                const cp2y = op.y1 + (op.y2 - op.y1) * 0.8 + op.ny * (h * 0.6);

                // --- シルエットの描画 ---
