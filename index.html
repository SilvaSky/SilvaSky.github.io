<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 クラフトゲーム</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }

        /* 3Dカメラの視点コンテナ */
        #screen {
            width: 100%;
            height: 100%;
            perspective: 600px;
            overflow: hidden;
            position: relative;
        }

        /* 3Dの世界（カメラの動きに合わせて回転・移動） */
        #world {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate3d(0, 100px, -400px) rotateX(-25deg) rotateY(45deg);
        }

        /* ブロックの基本定義 */
        .cube {
            position: absolute;
            width: 40px;
            height: 40px;
            transform-style: preserve-3d;
        }

        /* 立方体の6面 */
        .face {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(0,0,0,0.15);
            image-rendering: pixelated;
        }

        /* 各面の配置と偽擬似陰影用の色調整 */
        .front  { transform: rotateY(  0deg) translateZ(20px); background: #557a2b; }
        .back   { transform: rotateY(180deg) translateZ(20px); background: #4d6e27; }
        .left   { transform: rotateY(-90deg) translateZ(20px); background: #456323; }
        .right  { transform: rotateY( 90deg) translateZ(20px); background: #456323; }
        .top    { transform: rotateX( 90deg) translateZ(20px); background: #71a03c; }
        .bottom { transform: rotateX(-90deg) translateZ(20px); background: #2c3e16; }

        /* 土ブロック（下層用） */
        .dirt .front  { background: #866043; }
        .dirt .back   { background: #735239; }
        .dirt .left   { background: #674933; }
        .dirt .right  { background: #674933; }
        .dirt .top    { background: #866043; }
        .dirt .bottom { background: #4d3626; }

        /* 操作UI表示 */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 15px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
        }
        .block-select {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h3>HTML マイクラ風ミニゲーム</h3>
        <p>視点回転: 画面をドラッグ</p>
        <p>ブロック破壊: ブロックをクリック</p>
        <p>ブロック設置: Shift + クリック</p>
        <div class="block-select">
            設置タイプ: <span id="current-block">草ブロック</span> (Spaceキーで切替)
        </div>
    </div>

    <div id="screen">
        <div id="world"></div>
    </div>

    <script>
        const world = document.getElementById('world');
        const currentBlockTxt = document.getElementById('current-block');
        
        // ゲーム設定
        const BLOCK_SIZE = 40;
        const WORLD_SIZE = 8; // 8x8のエリア
        let blockType = 'grass'; // 'grass' または 'dirt'

        // カメラ（視点）の状態
        let rotX = -25;
        let rotY = 45;
        let panX = 0;
        let panZ = -400;

        // マウスドラッグによる視点変更の処理
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('face')) return; // ブロッククリック時は回転させない
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            rotY += deltaX * 0.5;
            rotX = Math.max(-75, Math.min(15, rotX - deltaY * 0.5)); // 画面がひっくり返らないよう制限

            previousMousePosition = { x: e.clientX, y: e.clientY };
            updateCamera();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // キーボード操作（Spaceでブロック切り替え）
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                blockType = blockType === 'grass' ? 'dirt' : 'grass';
                currentBlockTxt.innerText = blockType === 'grass' ? '草ブロック' : '土ブロック';
            }
        });

        // カメラの座標更新
        function updateCamera() {
            world.style.transform = `translate3d(${panX}px, 100px, ${panZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        // ブロックを生成する関数
        function createCube(x, y, z, type) {
            const cube = document.createElement('div');
            cube.className = `cube ${type}`;
            
            // 3D空間上の位置をCSSで決定
            cube.style.transform = `translate3d(${x * BLOCK_SIZE}px, ${-y * BLOCK_SIZE}px, ${z * BLOCK_SIZE}px)`;
            
            // グリッド座標をデータ属性に保持
            cube.dataset.x = x;
            cube.dataset.y = y;
            cube.dataset.z = z;

            // 6つの面を作成
            const faces = ['front', 'back', 'left', 'right', 'top', 'bottom'];
            faces.forEach(faceName => {
                const face = document.createElement('div');
                face.className = `face ${faceName}`;
                cube.appendChild(face);

                // クリック時の処理（破壊 or 設置）
                face.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    if (e.shiftKey) {
                        // Shift + クリック: 隣接した場所にブロックを設置
                        let nx = x, ny = y, nz = z;
                        if (faceName === 'front')  nz++;
                        if (faceName === 'back')   nz--;
                        if (faceName === 'left')   nx--;
                        if (faceName === 'right')  nx++;
                        if (faceName === 'top')    ny++;
                        if (faceName === 'bottom') ny--;
                        
                        createCube(nx, ny, nz, blockType);
                    } else {
                        // 通常クリック: ブロックを破壊
                        cube.remove();
                    }
                });
            });

            world.appendChild(cube);
        }

        // 初期平原（マップ）の自動生成
        function initMap() {
            for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x++) {
                for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z++) {
                    // 1階層目は土、2階層目（表面）は草
                    createCube(x, 0, z, 'dirt');
                    createCube(x, 1, z, 'grass');
                }
            }
        }

        // 初期化実行
        initMap();
        updateCamera();
    </script>
</body>
</html>
