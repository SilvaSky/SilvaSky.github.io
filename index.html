<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HTML5 クラフトゲーム Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; user-select: none; }

        /* 3Dカメラの視点コンテナ */
        #screen {
            width: 100%;
            height: 100%;
            perspective: 600px;
            overflow: hidden;
            position: relative;
        }

        /* 3Dの世界 */
        #world {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate3d(0, 100px, -400px) rotateX(-25deg) rotateY(45deg);
        }

        /* ブロックの基本定義 */
        .cube {
            position: absolute;
            width: 40px;
            height: 40px;
            transform-style: preserve-3d;
        }

        /* 立方体の6面 */
        .face {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(0,0,0,0.15);
        }

        /* --- 各ブロックのテクスチャ色（ドット絵風グラデーション） --- */
        /* 1. 草ブロック */
        .grass .front  { background: #557a2b; } .grass .back   { background: #4d6e27; }
        .grass .left   { background: #456323; } .grass .right  { background: #456323; }
        .grass .top    { background: #71a03c; } .grass .bottom { background: #2c3e16; }

        /* 2. 土ブロック */
        .dirt .front  { background: #866043; } .dirt .back   { background: #735239; }
        .dirt .left   { background: #674933; } .dirt .right  { background: #674933; }
        .dirt .top    { background: #866043; } .dirt .bottom { background: #4d3626; }

        /* 3. 石ブロック */
        .stone .front  { background: #737373; } .stone .back   { background: #666666; }
        .stone .left   { background: #595959; } .stone .right  { background: #595959; }
        .stone .top    { background: #808080; } .stone .bottom { background: #404040; }

        /* 4. 木ブロック */
        .wood .front  { background: #a67a53; } .wood .back   { background: #946d4a; }
        .wood .left   { background: #825f40; } .wood .right  { background: #825f40; }
        .wood .top    { background: #bf8d60; } .wood .bottom { background: #59412c; }

        /* 5. レンガブロック */
        .brick .front  { background: #b35946; border: 2px dashed #d98c7e; }
        .brick .back   { background: #9e4f3e; border: 2px dashed #d98c7e; }
        .brick .left   { background: #8a4536; border: 2px dashed #d98c7e; }
        .brick .right  { background: #8a4536; border: 2px dashed #d98c7e; }
        .brick .top    { background: #c7634e; border: 2px dashed #e6aba1; }
        .brick .bottom { background: #613026; }

        /* 各面の3D配置 */
        .front  { transform: rotateY(  0deg) translateZ(20px); }
        .back   { transform: rotateY(180deg) translateZ(20px); }
        .left   { transform: rotateY(-90deg) translateZ(20px); }
        .right  { transform: rotateY( 90deg) translateZ(20px); }
        .top    { transform: rotateX( 90deg) translateZ(20px); }
        .bottom { transform: rotateX(-90deg) translateZ(20px); }

        /* UI表示 */
        #ui {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            background: rgba(0,0,0,0.6); color: white;
            padding: 12px; border-radius: 8px;
            font-size: 13px; line-height: 1.4;
            pointer-events: none;
            z-index: 10;
        }

        /* 下部ブロック選択スロット（スマホ対応） */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0,0,0,0.5);
            padding: 6px;
            border-radius: 10px;
            gap: 8px;
            z-index: 10;
        }
        .slot {
            width: 45px; height: 45px;
            border: 2px solid #aaa;
            border-radius: 6px;
            background: #333;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .slot.active { border-color: #fff; background: #555; transform: scale(1.1); }
        .icon { width: 25px; height: 25px; border-radius: 3px; }
        .icon.grass { background: #71a03c; }
        .icon.dirt  { background: #866043; }
        .icon.stone { background: #808080; }
        .icon.wood  { background: #bf8d60; }
        .icon.brick { background: #c7634e; }
    </style>
</head>
<body>

    <div id="ui">
        <strong>HTML5 クラフトゲーム (スマホ対応版)</strong><br>
        ・画面スワイプ / ドラッグ: 視点回転<br>
        ・タップ / クリック: ブロックを【破壊】<br>
        ・長押し / Shift+クリック: ブロックを【設置】
    </div>

    <!-- 下部のアイテムスロット -->
    <div id="hotbar">
        <div class="slot active" data-type="grass"><div class="icon grass"></div></div>
        <div class="slot" data-type="dirt"><div class="icon dirt"></div></div>
        <div class="slot" data-type="stone"><div class="icon stone"></div></div>
        <div class="slot" data-type="wood"><div class="icon wood"></div></div>
        <div class="slot" data-type="brick"><div class="icon brick"></div></div>
    </div>

    <div id="screen">
        <div id="world"></div>
    </div>

    <script>
        const world = document.getElementById('world');
        const slots = document.querySelectorAll('.slot');
        
        const BLOCK_SIZE = 40;
        const WORLD_SIZE = 8; 
        let blockType = 'grass'; // 選択中のブロック

        // カメラ（視点）
        let rotX = -25; let rotY = 45;
        let panX = 0;   let panZ = -400;

        // タッチ・マウス共通のドラッグ処理
        let isDragging = false;
        let prevX = 0; let prevY = 0;

        function startPan(x, y, target) {
            if (target.classList.contains('face') || target.closest('#hotbar')) return;
            isDragging = true;
            prevX = x; prevY = y;
        }
        function movePan(x, y) {
            if (!isDragging) return;
            let dx = x - prevX; let dy = y - prevY;
            rotY += dx * 0.5;
            rotX = Math.max(-75, Math.min(15, rotX - dy * 0.5));
            prevX = x; prevY = y;
            updateCamera();
        }
        function endPan() { isDragging = false; }

        // マウスイベント
        window.addEventListener('mousedown', (e) => startPan(e.clientX, e.clientY, e.target));
        window.addEventListener('mousemove', (e) => movePan(e.clientX, e.clientY));
        window.addEventListener('mouseup', endPan);

        // タッチイベント (スマホ・タブレット用)
        window.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            startPan(t.clientX, t.clientY, e.target);
        });
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            movePan(t.clientX, t.clientY);
        });
        window.addEventListener('touchend', endPan);

        // カメラ更新
        function updateCamera() {
            world.style.transform = `translate3d(${panX}px, 100px, ${panZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        // 下部ホットバーのクリックイベント切り替え
        slots.forEach(slot => {
            const selectType = () => {
                slots.forEach(s => s.classList.remove('active'));
                slot.classList.add('active');
                blockType = slot.dataset.type;
            };
            slot.addEventListener('click', selectType);
            slot.addEventListener('touchstart', (e) => { e.stopPropagation(); selectType(); });
        });

        // ブロック作成システム
        function createCube(x, y, z, type) {
            const cube = document.createElement('div');
            cube.className = `cube ${type}`;
            cube.style.transform = `translate3d(${x * BLOCK_SIZE}px, ${-y * BLOCK_SIZE}px, ${z * BLOCK_SIZE}px)`;

            let touchTimer = null;
            let isLongPress = false;

            const faces = ['front', 'back', 'left', 'right', 'top', 'bottom'];
            faces.forEach(faceName => {
                const face = document.createElement('div');
                face.className = `face ${faceName}`;
                cube.appendChild(face);

                // ブロック設置アクション
                const placeBlock = () => {
                    let nx = x, ny = y, nz = z;
                    if (faceName === 'front')  nz++;
                    if (faceName === 'back')   nz--;
                    if (faceName === 'left')   nx--;
                    if (faceName === 'right')  nx++;
                    if (faceName === 'top')    ny++;
                    if (faceName === 'bottom') ny--;
                    createCube(nx, ny, nz, blockType);
                };

                // PC用: クリック判定（通常＝破壊、Shift＝設置）
                face.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (e.shiftKey) placeBlock();
                    else cube.remove();
                });

                // スマホ用: タップで破壊、長押し（500ms）で設置
                face.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    isLongPress = false;
                    touchTimer = setTimeout(() => {
                        isLongPress = true;
                        placeBlock(); // 長押しで設置
                    }, 500); 
                });

                face.addEventListener('touchend', (e) => {
                    e.stopPropagation();
                    clearTimeout(touchTimer);
                    if (!isLongPress) {
                        cube.remove(); // 短いタップなら破壊
                    }
                });

                face.addEventListener('touchmove', () => clearTimeout(touchTimer));
            });

            world.appendChild(cube);
        }

        // 初期マップ生成（2層構造）
        function initMap() {
            for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x++) {
                for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z++) {
                    createCube(x, 0, z, 'dirt');
                    createCube(x, 1, z, 'grass');
                }
            }
        }

        initMap();
        updateCamera();
    </script>
</body>
</html>
