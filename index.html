<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppai Brush</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #fff5f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        header {
            position: absolute;
            top: 20px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            color: #ff7675;
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        p {
            color: #b2bec3;
            font-size: 14px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .clear-btn {
            position: absolute;
            bottom: 30px;
            padding: 12px 24px;
            background-color: #ff7675;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 10;
        }
        .clear-btn:hover {
            background-color: #d63031;
            transform: scale(1.05);
        }
        .clear-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <h1>Oppai Brush</h1>
        <p>画面をドラッグして線を描いてみてね</p>
    </header>

    <canvas id="canvas"></canvas>

    <button class="clear-btn" id="clearBtn">画面をきれいにする</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');

        // キャンバスのサイズ設定
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // 背景を白（または薄いピンク）で初期化
            ctx.fillStyle = '#fff5f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        // おっぱいのサイズ（ここの数値を調整すると大きさが変わります）
        const oppaiSize = 40; 

        // マウス・タッチイベントの登録
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
            e.preventDefault();
        });
        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            draw({ clientX: touch.clientX, clientY: touch.clientY });
            e.preventDefault();
        });
        window.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            lastX = e.clientX;
            lastY = e.clientY;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function draw(e) {
            if (!isDrawing) return;

            const currentX = e.clientX;
            const currentY = e.clientY;

            // 前回移動した位置からの距離を計算
            const dx = currentX - lastX;
            const dy = currentY - lastY;
            const distance = Math.sqrt(dx * dx + dy * dy);

            // 一定以上の距離を動いたら「おっぱい」を描画
            if (distance >= oppaiSize * 1.5) {
                // 進んでいる方向の角度を計算
                const angle = Math.atan2(dy, dx);
                
                drawOppai(lastX, lastY, currentX, currentY, angle);

                // 基準点を更新
                lastX = currentX;
                lastY = currentY;
            }
        }

        // おっぱいを描画する関数
        function drawOppai(x1, y1, x2, y2, angle) {
            ctx.save();
            
            // 2点の中間地点
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;

            // 線の進行方向に対して垂直なベクトル（おっぱいの膨らむ方向）
            // +90度回転させて山を作る
            const normalX = Math.cos(angle + Math.PI / 2);
            const normalY = Math.sin(angle + Math.PI / 2);

            // おっぱいの山の高さ
            const breastHeight = oppaiSize * 0.8; 

            // ベジェ曲線の制御点（2つの山を作る）
            // 左の山
            const ctrlX1 = x1 + (x2 - x1) * 0.25 + normalX * breastHeight;
            const ctrlY1 = y1 + (y2 - y1) * 0.25 + normalY * breastHeight;
            // 右の山
            const ctrlX2 = x1 + (x2 - x1) * 0.75 + normalX * breastHeight;
            const ctrlY2 = y1 + (y2 - y1) * 0.75 + normalY * breastHeight;

            // --- 描画設定 ---
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ff7675'; // おっぱいの輪郭の色
            ctx.lineCap = 'round';

            // 左の乳房
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(ctrlX1, ctrlY1, midX, midY);
            ctx.stroke();

            // 右の乳房
            ctx.beginPath();
            ctx.moveTo(midX, midY);
            ctx.quadraticCurveTo(ctrlX2, ctrlY2, x2, y2);
            ctx.stroke();

            // --- 乳首（ちくび）の描画 ---
            ctx.fillStyle = '#ff9ff3'; // 乳首の色
            
            // 左の乳首（制御点に向かって少し膨らんだ頂点あたり）
            const nippleX1 = x1 + (x2 - x1) * 0.25 + normalX * (breastHeight * 0.5);
            const nippleY1 = y1 + (y2 - y1) * 0.25 + normalY * (breastHeight * 0.5);
            ctx.beginPath();
            ctx.arc(nippleX1, nippleY1, 4, 0, Math.PI * 2);
            ctx.fill();

            // 右の乳首
            const nippleX2 = x1 + (x2 - x1) * 0.75 + normalX * (breastHeight * 0.5);
            const nippleY2 = y1 + (y2 - y1) * 0.75 + normalY * (breastHeight * 0.5);
            ctx.beginPath();
            ctx.arc(nippleX2, nippleY2, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // 画面クリア
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            resizeCanvas();
        });
    </script>
</body>
</html>
