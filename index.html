<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>__kbvl // OFFICIAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Noto+Sans+JP:wght@300;700&display=swap');

        :root {
            --accent: #ff3e3e; /* 攻撃的な赤：Rustや対人ゲームのイメージ */
            --bg: #050505;
            --card-bg: #111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
        }

        /* 背景にノイズ感を出す演出 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url(https://grainy-gradients.vercel.app/noise.svg);
            opacity: 0.05;
            pointer-events: none;
            z-index: 9999;
        }

        /* --- ナビゲーション --- */
        nav {
            position: fixed;
            width: 100%;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            mix-blend-mode: difference;
        }

        .id-link {
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 5px;
            text-decoration: none;
            color: #fff;
        }

        /* --- ヒーロー --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1627398242454-45a1465c2479?q=80&w=1920&auto=format&fit=crop'); /* Minecraftの夜をイメージした画像 */
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            line-height: 1;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .hero .games {
            font-size: 0.9rem;
            letter-spacing: 10px;
            color: var(--accent);
            text-transform: uppercase;
        }

        /* --- セクション --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px;
        }

        .section-label {
            font-family: 'Syncopate', sans-serif;
            color: var(--accent);
            margin-bottom: 50px;
            display: block;
            font-size: 0.8rem;
        }

        /* --- ギャラリー（ゲーム画像） --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .card {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid #222;
            transition: 0.4s;
        }

        .card:hover {
            border-color: var(--accent);
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: 0.4s;
        }

        .card:hover img {
            opacity: 1;
            transform: scale(1.05);
        }

        .card-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
        }

        .card-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
        }

        /* --- フッター --- */
        footer {
            padding: 100px 20px;
            text-align: center;
            border-top: 1px solid #222;
        }

        .x-link {
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .x-link:hover {
            background: #fff;
            color: #000;
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--accent); }

    </style>
</head>
<body>

    <nav>
        <a href="#" class="id-link">__KBVL</a>
        <div><small>EST. 2024</small></div>
    </nav>

    <section class="hero">
        <div class="games">Minecraft / Rust / Others</div>
        <h1>__KBVL</h1>
        <p style="opacity: 0.5; letter-spacing: 2px;">DIGITAL SURVIVOR & ARCHITECT</p>
    </section>

    <div class="container">
        <span class="section-label">// LATEST ACTIVITY</span>
        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1615438822009-40813959dfb6?q=80&w=800" alt="Minecraft">
                <div class="card-content">
                    <div class="card-title">Minecraft</div>
                    <p>Building the world.</p>
                </div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800" alt="Gaming">
                <div class="card-content">
                    <div class="card-title">Rust</div>
                    <p>Survival of the fittest.</p>
                </div>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=800" alt="Retro Tech">
                <div class="card-content">
                    <div class="card-title">Setup</div>
                    <p>Optimized for performance.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <span class="section-label">GET IN TOUCH</span>
        <h2 style="font-size: 2rem; margin-bottom: 30px; font-family: 'Syncopate';">CONNECT WITH ME</h2>
        <a href="https://x.com/__kbvl" class="x-link" target="_blank">FOLLOW @__KBVL ON X</a>
        <p style="margin-top: 50px; opacity: 0.3; font-size: 0.7rem;">&copy; __KBVL. ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
