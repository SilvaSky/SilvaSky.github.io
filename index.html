<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Oppai Brush</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #fff3f5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            touch-action: none; /* スマホのスクロールを完全に禁止 */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        .info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ff5e7e;
            font-weight: bold;
            pointer-events: none;
            font-size: 16px;
            text-shadow: 1px 1px 0 #fff;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="info">画面をマウスでドラッグ、またはスマホでなぞって離してみてね</div>
    <canvas id="canvas"></canvas>

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // キャンバスのサイズを画面にフィットさせる
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let isDrawing = false;
        let currentStroke = [];

        // 物理アニメーション設定（ぷるぷる感）

        // --- マウスイベント (PC用) ---
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            currentStroke = [{ x: e.clientX, y: e.clientY }];
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            currentStroke.push({ x: e.clientX, y: e.clientY });
        });

        window.addEventListener('mouseup', () => {
            endDrawing();
        });

        // --- タッチイベント (スマホ・タブレット用) ---
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            const touch = e.touches[0];
            currentStroke = [{ x: touch.clientX, y: touch.clientY }];
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const touch = e.touches[0];
            currentStroke.push({ x: touch.clientX, y: touch.clientY });
            e.preventDefault(); // スクロール等の標準動作を確実にストップ
        }, { passive: false });

        window.addEventListener('touchend', () => {
            endDrawing();
        });
