<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppai Penint Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #fff0f2;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ff8fa3;
            font-weight: bold;
            pointer-events: none;
            font-size: 18px;
            text-shadow: 1px 1px 0 #fff;
        }
    </style>
</head>
<body>

    <div class="info">画面に線を引いて、パッと離してみてね</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let isDrawing = false;
        let currentStroke = [];
        let completedOppais = [];

        // アニメーション用の設定パラメータ
        const SPRING = 0.15;    // バネの強さ（ぷるぷる感）
        const FRICTION = 0.82;  // 摩擦（どれくらいで揺れが収まるか）

        // マウス & タッチイベント
        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);

        canvas.addEventListener('touchstart', e => { start(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener('touchmove', e => { move(e.touches[0]); e.preventDefault(); });
        window.addEventListener('touchend', end);

        function start(e) {
            isDrawing = true;
            currentStroke = [{ x: e.clientX, y: e.clientY }];
        }

        function move(e) {
            if (!isDrawing) return;
            currentStroke.push({ x: e.clientX, y: e.clientY });
        }

        function end() {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentStroke.length > 5) {
                // 始点と終点を取得
                const startPt = currentStroke[0];
                const endPt = currentStroke[currentStroke.length - 1];
                
                // 線の長さ（幅）を計算
                const dx = endPt.x - startPt.x;
                const dy = endPt.y - startPt.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // ある程度の長さがあればおっぱいに変換
                if (distance > 20) {
                    const midX = (startPt.x + endPt.x) / 2;
                    const midY = (startPt.y + endPt.y) / 2;
                    const angle = Math.atan2(dy, dx);

                    // 描いた線の「膨らみ」の平均的な向きを簡易計算（本家風に上または横に膨らむ）
                    // 進行方向の左側に膨らませる
                    const nx = Math.cos(angle - Math.PI / 2);
                    const ny = Math.sin(angle - Math.PI / 2);

                    // 目標となるおっぱいの高さ（線の長さに比例）
                    const targetHeight = distance * 0.4;

                    completedOppais.push({
                        x1: startPt.x, y1: startPt.y,
                        x2: endPt.x, y2: endPt.y,
                        midX: midX, midY: midY,
                        nx: nx, ny: ny,
                        angle: angle,
                        length: distance,
                        
                        // アニメーション用変数
                        height: 0,          // 現在の高さ（0からスタート）
                        targetHeight: targetHeight,
                        velocity: 0,        // 物理演算の速度
                        opacity: 1,
                        life: 1.0           // 徐々に消える演出用（不要なら消してOK）
                    });
                }
            }
            currentStroke = [];
        }

        // メインアニメーションループ
        function loop() {
            // 画面クリア（淡いピンク背景）
            ctx.fillStyle = '#fff0f2';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 現在描いている途中の生々しい線を描画
            if (isDrawing && currentStroke.length > 1) {
                ctx.beginPath();
                ctx.moveTo(currentStroke[0].x, currentStroke[0].y);
                for (let i = 1; i < currentStroke.length; i++) {
                    ctx.lineTo(currentStroke[i].x, currentStroke[i].y);
                }
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#ffb3c1';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // 2. 描き終わったおっぱいたちの物理演算＆描画
            for (let i = completedOppais.length - 1; i >= 0; i--) {
                const op = completedOppais[i];

                // フックの法則（バネ運動）で「ぷるんぷるん」を計算
                const acceleration = (op.targetHeight - op.height) * SPRING;
                op.velocity += acceleration;
                op.velocity *= FRICTION;
                op.height += op.velocity;

                // 時間経過でちょっとずつ薄くして消す（本家風の余韻）
                op.life -= 0.002; 
                if (op.life <= 0) {
                    completedOppais.splice(i, 1);
                    continue;
                }

                // 描画設定
                ctx.save();
                ctx.globalAlpha = Math.min(1, op.life * 5); // 消え際だけフェードアウト
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#ff758f';
                ctx.fillStyle = '#ff758f';
                ctx.lineCap = 'round';

                // おっぱいの山の頂点を計算
                const hx = op.midX + op.nx * op.height;
                const hy = op.midY + op.ny * op.height;

                // 左の乳房の山
                const leftMidX = op.x1 + (hx - op.x1) * 0.6;
                const leftMidY = op.y1 + (hy - op.y1) * 0.6;
                // 右の乳房の山
                const rightMidX = op.x2 + (hx - op.x2) * 0.6;
                const rightMidY = op.y2 + (hy - op.y2) * 0.6;

                // 制御点の計算（綺麗なふくらみを作るため）
                const cpLeftX = leftMidX + op.nx * (op.height * 0.3);
                const cpLeftY = leftMidY + op.ny * (op.height * 0.3);
                const cpRightX = rightMidX + op.nx * (op.height * 0.3);
                const cpRightY = rightMidY + op.ny * (op.height * 0.3);

                // --- 輪郭の描画 ---
                ctx.beginPath();
                ctx.moveTo(op.x1, op.y1);
                // 左のふくらみ
                ctx.quadraticCurveTo(cpLeftX, cpLeftY, hx, hy);
                // 右のふくらみ
                ctx.quadraticCurveTo(cpRightX, cpRightY, op.x2, op.y2);
                ctx.stroke();

                // --- 乳首（ちくび）の描画 ---
                // ぷるぷるに合わせて乳首の位置も動く
                ctx.fillStyle = '#ffb3c1';
                const nipRadius = Math.max(3, op.length * 0.03); // 線の長さに合わせてサイズ変更

                // 左乳首
                const nipLeftX = op.x1 + (hx - op.x1) * 0.65;
                const nipLeftY = op.y1 + (hy - op.y1) * 0.65;
                ctx.beginPath();
                ctx.arc(nipLeftX, nipLeftY, nipRadius, 0, Math.PI * 2);
                ctx.fill();

                // 右乳首
                const nipRightX = op.x2 + (hx - op.x2) * 0.65;
                const nipRightY = op.y2 + (hy - op.y2) * 0.65;
                ctx.beginPath();
                ctx.arc(nipRightX, nipRightY, nipRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            requestAnimationFrame(loop);
        }

        // アニメーション開始
        loop();
    </script>
</body>
</html>
