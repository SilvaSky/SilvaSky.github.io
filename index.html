<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Oppai Brush Test</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff3f5;
            touch-action: none; /* スマホのスクロールを強制拒否 */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .msg {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: #ff5e7e;
            font-family: sans-serif;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="msg">テスト：画面を適当になぞって指を離してみてね</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 画面サイズにキャンバスを合わせる
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let isDrawing = false;
        let points = [];
        let shapes = [];

        // --- マウス操作 ---
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            points = [{ x: e.clientX, y: e.clientY }];
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            points.push({ x: e.clientX, y: e.clientY });
        });
        window.addEventListener('mouseup', () => {
            if (isDrawing) endStroke();
        });

        // --- スマホタッチ操作（最も原始的で確実な書き方） ---
        canvas.ontouchstart = function(e) {
            isDrawing = true;
            const t = e.touches[0];
            points = [{ x: t.clientX, y: t.clientY }];
        };
        canvas.ontouchmove = function(e) {
            if (!isDrawing) return;
            const t = e.touches[0];
            points.push({ x: t.clientX, y: t.clientY });
            e.preventDefault();
        };
        canvas.ontouchend = function() {
            if (isDrawing) endStroke();
        };

        // --- 離した時の処理 ---
        function endStroke() {
            isDrawing = false;
            if (points.length < 2) return;

            const p1 = points[0];
            const p2 = points[points.length - 1];

            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 10) {
                const angle = Math.atan2(dy, dx);
                const nx = Math.cos(angle - Math.PI / 2);
                const ny = Math.sin(angle - Math.PI / 2);

                // 新しいおっぱいデータを登録
                shapes.push({
                    x1: p1.x, y1: p1.y,
                    x2: p2.x, y2: p2.y,
                    nx: nx, ny: ny,
                    angle: angle,
                    len: dist,
                    t: 0 // アニメーション用タイマー
                });
            }
            points = [];
        }

        // --- ループ描画 ---
        function draw() {
            // 背景クリア
            ctx.fillStyle = '#fff3f5';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 1. 引いてる最中の線
            if (isDrawing && points.length > 1) {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffb3c1';
                ctx.stroke();
            }

            // 2. 確定したおっぱいシルエット
            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i];
                s.t += 0.1; // タイマーを進める

                // 物理演算ではなく、一番確実なサイン波によるぷるぷる
                const pulse = Math.sin(s.t * 4) * Math.exp(-s.t * 0.3); 
                const scale = 1.0 + pulse * 0.3; // 1.0を基準に揺れる

                // 一定時間で消す
                if (s.t > 8) {
                    shapes.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#222222';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const h = s.len * 0.55 * Math.max(0, scale);

                // シルエット計算
                const cp1x = s.x1 + (s.x2 - s.x1) * 0.3 + s.nx * (h * 0.35);
                const cp1y = s.y1 + (s.y2 - s.y1) * 0.3 + s.ny * (h * 0.35);

                const nipX = s.x1 + (s.x2 - s.x1) * 0.55 + s.nx * h;
                const nipY = s.x1 + (s.x2 - s.x1) * 0.55 + s.ny * h;

                const cp2x = s.x1 + (s.x2 - s.x1) * 0.8 + s.nx * (h * 0.65);
                const cp2y = s.y1 + (s.y2 - s.y1) * 0.8 + s.ny * (h * 0.65);

                ctx.beginPath();
                ctx.moveTo(s.x1, s.y1);
                ctx.quadraticCurveTo(cp1x, cp1y, nipX - (s.x2 - s.x1) * 0.02, nipY - (s.y2 - s.y1) * 0.02);

                const nipRadius = s.len * 0.04;
                ctx.arc(nipX, nipY, nipRadius, s.angle - Math.PI * 0.7, s.angle + Math.PI * 0.4);

                ctx.quadraticCurveTo(cp2x, cp2y, s.x2, s.y2);
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
